<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c7d2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="200" cy="200" r="180" fill="url(#logoGradient)" filter="url(#glow)" opacity="0.9"/>
  
  <!-- Pin Shape -->
  <path d="M200 80 C160 80 130 110 130 150 C130 190 200 280 200 280 C200 280 270 190 270 150 C270 110 240 80 200 80 Z" 
        fill="url(#pinGradient)" 
        filter="url(#glow)"/>
  
  <!-- Pin Center Dot -->
  <circle cx="200" cy="150" r="25" fill="#8b5cf6" filter="url(#glow)"/>
  
  <!-- App Name -->
  <text x="200" y="350" font-family="Inter, sans-serif" font-size="32" font-weight="bold" 
        text-anchor="middle" fill="url(#pinGradient)" filter="url(#glow)">
    ParkPin
  </text>
</svg>